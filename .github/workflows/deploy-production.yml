name: Deploy Production

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    # Configure required reviewers on the "production" GitHub Environment.
    # A single concurrency group serializes all team deployments to Production.
    concurrency:
      group: salesforce-production
      cancel-in-progress: false

    uses: ./.github/workflows/_salesforce-deploy.yml
    with:
      github_environment: production
      from_ref: ${{ github.event.before }}
      to_ref: ${{ github.sha }}
      operation: deploy
      test_level: RunLocalTests
    secrets: inherit
